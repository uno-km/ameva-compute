android.useAndroidX=true
# The APK/AAR packaging step holds every bundled native library in memory (sherpa-onnx +
# onnxruntime + ggml + whisper + stable-diffusion); the default 512m daemon heap fails with
# "OutOfMemoryError: Java heap space" in :packageDebugAndroidTest.
org.gradle.jvmargs=-Xmx3g -XX:MaxMetaspaceSize=768m
