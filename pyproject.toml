[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ameva-compute"
version = "2.1.0"
description = "AMUDA: Ultra-lightweight CUDA-like GPGPU Runtime for Mobile & Termux — Vulkan 1.3 SPIR-V Compute"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Kim Eunho", email = "uno@ameva.io" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: C",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "numpy>=1.20.0"
]

[project.urls]
Homepage = "https://github.com/uno-km/ameva-compute"
Repository = "https://github.com/uno-km/ameva-compute.git"
Documentation = "https://github.com/uno-km/ameva-compute/tree/main/docs"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
ameva_compute = ["*.so", "*.dll", "*.dylib", "*.spv"]
